# incant configuration. Personal overrides go in incant.local.toml (gitignored).
# Relative paths resolve against this file's directory; work_dir and output_dir against the data directory ([paths]).

# Default method per stage, used when the command line doesn't name one.
# "auto" = detect from the input (ingest).
[pipeline]
# The defaults need no server or GPU: rule-based speakers and Kokoro voices on the CPU, all built in.
# With an LLM server or key (see [llm]), parse = "characters" and attribute = "speakers" reach 95%.
ingest = "auto"
parse = "basic"              # chapters only; "characters" = LLM character profiles (~10 min/book)
attribute = "tags"           # rules: dialogue tags, pronouns, turn-taking, seconds (68%; 80% after parse=characters);
                             # "speakers" = LLM speaker + emotion per quote (~8 min/book, 95%); "narrator" = one voice
normalize = "rules"          # spell out numerals/numbers/abbreviations/caps for the TTS; "none" = markup only
synthesize = "kokoro"        # local CPU, no server; "indextts" / "openai" = speech servers; "elevenlabs"; "dummy"
output = "m4b"               # "mp3" = one chaptered mp3; "chapters" = a file per chapter + playlist
[run]
cleanup_failed = "new"       # a failed run deletes a book it created ("never" keeps it); never books with audio
lanes = "host"               # batches: book 2 is fetched/attributed while book 1 is voiced, one book at a time
                             # per server; "host": one lane per machine (shared GPU), "endpoint": per port, "off"

[paths]
# Data directory (books/, work/, output/, incant.local.toml, cookies): INCANT_DATA=… in .env next to this
# file, or $INCANT_DATA; else data_dir here; else this directory. work_dir and output_dir are inside it.
work_dir = "work"
voices_dir = "voices"         # (relative to this file: the program's voice list)
output_dir = "output"         # finished books: output/<author>/<title>/<title>.m4b

[cast]
# narrator = "…"             # one voice id for every backend; normally set per backend ([synthesize.<name>] narrator)
main_unique = 8              # the N characters with most lines never share a voice
# Speaking characters are cast automatically into the book's cast.json from voice gender/age/tone tags;
# automatic picks are redone each run, while roles you set by hand (cast.json or the review page) are kept.

# [credits]                  # terms you know, for credits.txt beside each audiobook (README: "Credits")
# llm = "provider terms: Qwen license"
# "synthesize.indextts" = "non-commercial: check your checkpoint's license"

[review]
host = "127.0.0.1"           # local access and same-machine Caddy
port = 8765
# Set both for Caddy HTTPS access. Use exact DNS names and Caddy's actual TCP source IP.
# public_domains = ["incant.example.com"]
# trusted_proxy_ips = ["127.0.0.1"]
# For Caddy on another machine, bind to Incant's LAN IP and trust Caddy's LAN IP.

# All LLM stages run over the whole book before synthesis starts, so one GPU can serve the LLM and then the
# TTS (llama-swap swaps models on demand).
# Select a named profile with current_llm = "name" (or [llm] active = "name", or CLI --llm name).
# Named profiles can be subtables ([llm.<name>]), [llms.<name>], or top-level tables ([<name>]).
[llm]                        # for parse = "characters" / attribute = "speakers" (README: "Configuration")
base_url = "http://localhost:8080/v1"
# dialect = "llama.cpp" (default) | "openai" (Ollama, LM Studio, OpenRouter, OpenAI, Gemini) | "anthropic" (Claude);
# api_key_env names a key in the environment or a .env file (data directory first). Cloud presets (README):
# schema_style = "simple" (Gemini), reasoning_effort / min_max_tokens (reasoning models), retries, effort (Claude)
model = "qwen3.5-9b"
concurrency = 4              # llama.cpp slots
context_tokens = 32768       # KV cache shared by ALL slots; requests are admitted to fit it
temperature = 0.0

[audio]                      # shared by all synthesize methods
sample_rate = 22050          # IndexTTS native rate
target_lufs = -19.0
true_peak_db = -3.0

# ---- per-method settings: [<stage>.<method>] ----

[ingest.url]                 # web pages (also every page of a bookmark file)
timeout_s = 30
netrc = true                 # ~/.netrc logins for hosts without a [sites] entry
allow_bogons = false         # refuse URLs, redirects and rendered-page requests to loopback, LAN, link-local
                             # (cloud metadata) and other non-public addresses; true for pages on your own network
# Logins: put these in incant.local.toml (git-ignored). Sent only to that host (and subdomains). The secrets
# themselves go in the environment or a .env file, never in TOML; these settings name the variables.
# [ingest.url.sites."example.com"]
# username = "me"
# password_env = "EXAMPLE_PASSWORD"       # or bearer_env = "…"; headers_env = { "X-Api-Key" = "VARIABLE" }
# cookies = "~/cookies/example.txt"      # cookies.txt exported from a logged-in browser

# [ingest.ao3]                 # Archive of Our Own works: every chapter of a work as one book (inherits [ingest.url])
# view_adult = true            # pass the site's age confirmation (view_adult cookie + ?view_adult=true)
# max_parts = 200              # chapters per work
# part_delay_s = 1.0           # pause between chapter fetches

# Author's notes, intros, sign-offs and site text at chapter edges ("This is a story about…", "Thanks for
# reading!", "Click here to tip"): metatext = "auto" (rules for web pages, off for books) | "rules" | "llm" | "off".
# What was removed is listed in work/<book>/removed.txt. Set it per parse method, e.g. [parse.basic] metatext = "llm".
[parse.characters]
window_words = 5000          # split long chapters in chapter and neighbors modes
extraction_mode = "neighbors" # one target chapter plus surrounding text. "batch" profiles several together.
context_tokens = 262144      # 256 Ki tokens per extraction request, including the response and subject to [llm]
context_chapters = 1         # neighboring chapters on each side, as space allows
# batch_chapters = 4         # maximum target chapters per request in batch mode
# batch_max_tokens = 16384   # generated-token reserve for batch mode
think = false                # thinking for extraction: ~10x slower, little gain
verify_links_with_thinking = true
max_tokens_thinking = 6144

[attribute.speakers]
max_quotes = 25              # quotations per request
context_tokens = 262144      # estimated total request budget, capped by [llm]
# context_paragraphs = 4     # optional maximum on either side of the target. Unset uses the token budget.
# narrator_chapters = 5      # sample the book from beginning to end for first-person narrator identification
emotion_scale = 0.8          # intensity -> IndexTTS emo_alpha
min_intensity = 0.3          # weaker emotions are rendered neutral

[normalize.rules]
lexicon = "lexicon.toml"     # [words] Name = "respelling"; plus <work>/<book>/lexicon.toml

[synthesize.indextts]        # an IndexTTS-2 server with an OpenAI-style API (voices: voices/voices.json)
narrator = "a_janelle_risa"
base_url = "http://localhost:8080/v1"
model = "indextts-2.5"
lang = "en"
speed = 1.0
use_random = false           # deterministic: same text + voice -> same audio (cache-friendly)
concurrency = 2              # server is serial; 2 just overlaps network with generation
max_segment_chars = 300
qa = true                    # speech-to-text check of every segment (CPU, faster-whisper base.en)
qa_max_wer = 0.25
qa_retries = 2

[synthesize.kokoro]          # Kokoro-82M on the CPU (uv sync --extra kokoro); model files download on first use
# narrator = "af_heart"      # default; voices: a*/b* = American/British English (voicesets.py); voices/kokoro.json
model = "fp32"               # "int8": smaller download, not faster on most CPUs
g2p = "auto"                 # misaki (Kokoro's own English pronunciation, nlp extra) if installed, else espeak
speed = 1.0
qa = true

[synthesize.openai]          # any OpenAI-style speech server; defaults fit Kokoro-FastAPI (docker, port 8880)
base_url = "http://localhost:8880/v1"
model = "kokoro"
voices = "kokoro"            # built-in voice list: "kokoro", "openai" (alloy, nova…), or "none" (voices/openai.json only)
# api_key_env = "OPENAI_API_KEY"; instructions = true  # gpt-4o-mini-tts: speak each line's emotion

[synthesize.elevenlabs]      # paid cloud TTS; key in ELEVENLABS_API_KEY (environment or the data directory's .env)
model_id = "eleven_multilingual_v2"
allow_over_quota = false     # stop before rendering more characters than the subscription has left (or when a
                             # key without user_read can't tell); narrator default: an account voice described
                             # as narration, else George (stock)

[synthesize.dummy]           # offline beeps — exercises the whole pipeline without a TTS server
concurrency = 4

[output.m4b]
bitrate = "64k"              # mono AAC; plenty for speech

[output.mp3]
bitrate = "64k"

[output.chapters]
format = "mp3"               # "opus" (32k is plenty), "m4a"
bitrate = "64k"
