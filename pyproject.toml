[project]
name = "incant"
version = "0.4.0"
description = "Ingest Novels, Cast Actors, Narrate Tales: multi-voice audiobooks from EPUB, Kindle, PDF, Word and web pages, with local or cloud LLMs and TTS."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "BGWJJILLIGKKK", email = "BGWJJILLIGKKK@testsinprod.dev" }]
keywords = ["audiobook", "text-to-speech", "tts", "epub", "llm", "speaker-attribution", "kokoro"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing",
]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.12",
    "num2words>=0.5",
    "numpy>=1.26",
    "pdfminer.six>=20231228",
]

[project.optional-dependencies]
qa = ["faster-whisper>=1.1"]  # speech-to-text check of rendered segments (CPU)
browser = ["playwright>=1.47"]  # render JavaScript-built pages (then: playwright install chromium)
kokoro = ["kokoro-onnx>=0.4"]  # local Kokoro-82M TTS on CPU (model files download on first use, ~340 MB)
anthropic = ["anthropic>=2.6"]  # [llm] dialect = "anthropic": Claude through the official SDK
mobi = ["mobi>=0.4"]  # Kindle books (mobi, azw3) without Calibre; KindleUnpack, GPL-3.0 (a tool), ~100 KB
nlp = [  # Misaki pronunciation for Kokoro (the default when installed): spaCy + model, ~110 MB, no PyTorch
    "spacy>=3.8,<3.9",
    "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "misaki>=0.9.4",  # without its [en] extra, which pulls in PyTorch
]
torch = [  # the incant_local image: ingest=docling (OCR for scanned PDFs) on CPU-only PyTorch
    "docling>=2",
    "torch>=2.4",
    "torchvision",  # listed so it also comes from the CPU index, matching torch
]

[project.urls]
Homepage = "https://github.com/BGWJJILLIGKKK/incant"
Documentation = "https://github.com/BGWJJILLIGKKK/incant/blob/main/docs/quickstart.md"
Issues = "https://github.com/BGWJJILLIGKKK/incant/issues"
Changelog = "https://github.com/BGWJJILLIGKKK/incant/blob/main/CHANGELOG.md"

[project.scripts]
incant = "incant.cli:main"

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4", "pyphen>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:'imghdr' is deprecated:DeprecationWarning"]  # inside the mobi package (has a 3.13 shim)

[tool.hatch.metadata]
allow-direct-references = true  # the spaCy model (nlp extra) is a wheel URL, not on PyPI

# PyTorch for the torch extra comes from its CPU-only index (the default Linux wheels carry 2-3 GB of CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
