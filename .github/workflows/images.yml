# Release images, built from a fresh checkout of the tagged commit: only committed files reach the build
# context, whatever else exists in anyone's working copy.
#
# Pushes to the GitHub Container Registry (ghcr.io/<owner>/incant, ghcr.io/<owner>/incant_local) with the
# workflow's own token. Docker Hub too when the repository has the secrets DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN (pushed as <DOCKERHUB_USERNAME>/incant…).
name: images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: incant
            extras: "qa browser kokoro anthropic nlp mobi"
          - name: incant_local
            extras: "qa browser kokoro anthropic nlp mobi torch"
    env:
      HAVE_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Free disk space (the images are 4-7 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v4

      - id: names
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          images="ghcr.io/$owner/${{ matrix.name }}"
          if [ "$HAVE_DOCKERHUB" = "true" ]; then
            images="$images"$'\n'"$(echo '${{ secrets.DOCKERHUB_USERNAME }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.name }}"
          fi
          { echo "images<<EOF"; echo "$images"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: env.HAVE_DOCKERHUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: EXTRAS=${{ matrix.extras }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
