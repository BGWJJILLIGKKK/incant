# The data directory (books, work/, output/, incant.local.toml, cookies) is mounted at /data. Set it, and
# your uid/gid, in this project's .env — the same file ./incant and the config loader read:
#   INCANT_DATA=/srv/audiobooks
#   UID=1000
#   GID=1000
#
# docker compose run --rm incant books/book.epub          (paths relative to the data directory)
# docker compose run --rm incant --check
# docker compose run --rm incant pride-and-prejudice --review
services:
  incant:
    build: .
    image: incant
    user: "${UID:-1000}:${GID:-1000}"     # files written to the data directory stay yours
    network_mode: host                    # reach the LLM/TTS servers by the names the host uses (localhost:8080)
    volumes:
      - ${INCANT_DATA:-.}:/data
    # Docker Desktop (Mac, Windows) keeps host networking off by default: add compose.desktop.yaml
    # (COMPOSE_FILE=compose.yaml:compose.desktop.yaml in .env; docs/quickstart.md).

  # The heavy local variant: + PyTorch (CPU) and Docling with its models (OCR for scanned PDFs).
  #   docker compose --profile local build incant_local
  #   docker compose run --rm incant_local books/scan.pdf docling …
  incant_local:
    profiles: ["local"]
    build:
      context: .
      args:
        EXTRAS: "qa browser kokoro anthropic nlp mobi torch"
    image: incant_local
    user: "${UID:-1000}:${GID:-1000}"
    network_mode: host
    volumes:
      - ${INCANT_DATA:-.}:/data
