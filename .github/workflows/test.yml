name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: uv sync --python 3.12 --extra qa --extra kokoro --extra nlp --extra mobi --extra anthropic
      - run: uvx ruff check --select E9,F src tests eval
      - run: uv run pytest -q
